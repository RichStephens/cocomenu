name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: fozztexx/defoogi:1.4.8

    steps:
      - uses: actions/checkout@v4

      - name: Verify changelog has a section for this tag
        run: python3 .github/scripts/changelog-notes.py "${{ github.ref_name }}" > /dev/null

      - name: Build release zip
        shell: bash
        run: |
          version="${{ github.ref_name }}"
          make release VERSION="${version#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/changelog-notes.py "${{ github.ref_name }}" > release-notes.md
          gh release create "${{ github.ref_name }}" dist/*.zip \
            --title "cocomenu ${{ github.ref_name }}" \
            --notes-file release-notes.md
